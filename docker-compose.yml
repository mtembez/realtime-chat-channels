version: '3.9'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realtime_chat}
      POSTGRES_USER: ${POSTGRES_USER:-jifunze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jifunze}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jifunze} -d ${POSTGRES_DB:-realtime_chat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "realtime_chat.asgi:application"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jifunze}:${POSTGRES_PASSWORD:-jifunze}@db:5432/${POSTGRES_DB:-realtime_chat}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-32-chars-minimum-length-realtime-chat}
      DEBUG: "0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "realtime_chat", "worker", "-l", "info", "-B"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jifunze}:${POSTGRES_PASSWORD:-jifunze}@db:5432/${POSTGRES_DB:-realtime_chat}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-32-chars-minimum-length-realtime-chat}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
